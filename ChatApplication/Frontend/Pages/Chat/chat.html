<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <!-- Main Layout Wrapper -->
    <div class="main-layout-container">

        <!-- COLUMN 1: Sleek Navigation (Sidebar) -->
        <nav class="column-nav">
            <div class="nav-top">
                <button class="nav-btn chats-btn">Chats</button>
                <button class="nav-btn self-profile-btn">
                    Profile
                </button>
            </div>

            <div class="nav-bottom">
                <!-- Bottom Button (Logout) -->
                <button class="nav-btn logout-btn">
                    Logout
                </button>
            </div>
        </nav>

        <!-- COLUMN 2: Chat List -->
        <aside class="column-chat-list">
            <header class="list-header">
                <input type="text" class="search-input" placeholder="Chats...">
            </header>

            <div class="chat-items-container">
                <!-- Single Chat Item -->
                <div class="chat-item active">
                    <div class="avatar"><img src="default-avtar.png" alt="photo"></div>
                    <div class="chat-info">
                        <span class="name">User Name</span>
                        <span class="preview">Last message...</span>
                    </div>
                </div>
                <!-- Repeat chat items as needed -->
                 <div class="chat-item">
                    <div class="avatar"><img src="default-avtar.png" alt=""></div>
                    <div class="chat-info">
                        <span class="name">Another User</span>
                        <span class="preview">See you later!</span>
                    </div>
                    <div class="chat-notify"><span class="c-notify"></span></div>
                </div>
            </div>
        </aside>

        <!-- COLUMN 3: Active Chat Conversation -->
        <main class="column-active-chat">
            <header class="chat-header">
                <div class="user-status">
                    <span class="status-image"><img src="default-avtar.png" alt=""></span>
                    <span class="status-name">Current Contact</span>
                </div>
            </header>

            <div class="messages-area">
                <p>No messages available</p>
            </div>

            <footer class="chat-input-area">
                <input type="text" class="message-input" placeholder="Type a message..." value="">
                <button class="send-btn">Send</button>
            </footer>
        </main>

        <!-- COLUMN 4: User Profile Details -->
        <aside class="column-profile" style="display: none;">
            <div class="profile-header">
                <div class="large-avatar"><img src="default-avtar.png" alt=""></div>
                <h2 class="profile-name">Profile Name</h2>
            </div>

            <div class="profile-sections">
                <section class="media-section">
                    <div class="media-grid">
                        <div class="media-item">Full Name</div>
                        <div class="media-item">email</div>
                    </div>
                </section>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
