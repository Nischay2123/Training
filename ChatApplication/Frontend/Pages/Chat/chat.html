<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <!-- Main Layout Wrapper -->
    <div class="main-layout-container">

        <!-- COLUMN 1: Sleek Navigation (Sidebar) -->
        <nav class="column-nav">
            <div class="nav-top">
                <button class="nav-btn chats-btn">Chats</button>
                <button class="nav-btn self-profile-btn">
                    Profile
                </button>
            </div>

            <div class="nav-bottom">
                <!-- Bottom Button (Logout) -->
                <button class="nav-btn logout-btn">
                    Logout
                </button>
            </div>
        </nav>

        <!-- COLUMN 2: Chat List -->
        <aside class="column-chat-list">
            <header class="list-header">
                <input type="text" class="search-input" placeholder="Chats...">
            </header>

            <div class="chat-items-container">
                <!-- Single Chat Item -->
                <div class="chat-item active">
                    <div class="avatar"><img src="user-3296.png" alt="photo"></div>
                    <div class="chat-info">
                        <span class="name">User Name</span>
                        <span class="preview">Last message...</span>
                    </div>
                </div>
                <!-- Repeat chat items as needed -->
                 <div class="chat-item">
                    <div class="avatar"><img src="user-3296.png" alt=""></div>
                    <div class="chat-info">
                        <span class="name">Another User</span>
                        <span class="preview">See you later!</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- COLUMN 3: Active Chat Conversation -->
        <main class="column-active-chat">
            <header class="chat-header">
                <div class="user-status">
                    <span class="status-image"><img src="user-3296.png" alt=""></span>
                    <span class="status-name">Current Contact</span>
                </div>
            </header>

            <div class="messages-area">
                <!-- Incoming Message -->
                <div class="message-wrapper incoming">
                    <div class="bubble">Hello there!</div>
                    <span class="timestamp">10:00 AM</span>
                </div>

                <!-- Outgoing Message -->
                <div class="message-wrapper outgoing">
                    <div class="bubble">Hi! How are you?</div>
                    <span class="timestamp">10:01 AM</span>
                </div>
            </div>

            <footer class="chat-input-area">
                <input type="text" class="message-input" placeholder="Type a message...">
                <button class="send-btn">Send</button>
            </footer>
        </main>

        <!-- COLUMN 4: User Profile Details -->
        <aside class="column-profile">
            <div class="profile-header">
                <div class="large-avatar"></div>
                <h3 class="profile-name">Profile Name</h3>
                <p class="profile-role">Job Title / Status</p>
            </div>

            <div class="profile-sections">
                <section class="media-section">
                    <h4>Shared Media</h4>
                    <div class="media-grid">
                        <div class="media-item">Img</div>
                        <div class="media-item">Img</div>
                        <div class="media-item">Img</div>
                    </div>
                </section>

                <section class="options-section">
                    <button class="option-btn">Notifications</button>
                    <button class="option-btn">Privacy</button>
                    <button class="option-btn danger">Block User</button>
                </section>
            </div>
        </aside>

    </div>

</body>
</html>
